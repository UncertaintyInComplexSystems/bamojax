jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install BaMoJAX and dependencies
        run: uv sync --locked --python 3.11

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ -v


