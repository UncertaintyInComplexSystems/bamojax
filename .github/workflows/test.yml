name: Run tests (CPU)

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main
      - feat/**
  workflow_dispatch:  # <-- add temporarily so you can run it by hand

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


